<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 대시보드 | AI Insight Agency</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="config.js"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --glass: rgba(255, 255, 255, 0.05);
            --accent: #38bdf8;
        }

        body {
            background: var(--bg-dark);
            color: white;
            display: flex;
            height: 100vh;
            overflow: hidden;
            font-family: 'Inter', system-ui, sans-serif;
        }

        .admin-sidebar {
            width: 350px;
            background: var(--glass);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
        }

        .header {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .log-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .log-item {
            padding: 15px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid transparent;
        }

        .log-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .log-item.active {
            border-color: var(--accent);
            background: rgba(56, 189, 248, 0.1);
        }

        .log-name {
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 0.9em;
        }

        .log-date {
            font-size: 0.75em;
            color: #94a3b8;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.2);
        }

        .summary-box {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.1), rgba(0, 0, 0, 0));
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
        }

        .chat-view {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 15px;
            line-height: 1.5;
            font-size: 0.95em;
        }

        .user {
            align-self: flex-end;
            background: var(--accent);
            color: #0f172a;
            font-weight: 500;
        }

        .model {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-summary {
            background: var(--accent);
            color: #0f172a;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 20px;
            display: none;
        }

        #loading {
            text-align: center;
            padding: 20px;
            color: var(--accent);
        }
    </style>
</head>

<body>
    <div class="admin-sidebar">
        <div class="header">
            <h2>대화 모니터링</h2>
            <p style="font-size: 0.8em; color: #94a3b8;">최근 사용자 대화 로그</p>
        </div>
        <div id="loading">로그 불러오는 중...</div>
        <div class="log-list" id="logList"></div>
    </div>

    <div class="main-content" id="mainContent">
        <button id="summaryBtn" class="btn-summary">✨ AI 대화 요약하기</button>
        <div id="summaryResult" class="summary-box"></div>
        <div class="chat-view" id="chatView">
            <div style="text-align: center; color: #64748b; margin-top: 50px;">
                왼쪽 목록에서 로그를 선택해주세요.
            </div>
        </div>
    </div>

    <script type="module" src="js/admin.js"></script>
</body>

</html>
